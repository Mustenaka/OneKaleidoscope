schema_version = 1

# Selector contract: method entries cover the method/operation envelope only.
# Every payload type UACP consumes is declared separately below; type entries
# include their transitive local $ref closure. This keeps aggregate endpoints
# such as OpenCode GET /event from importing unrelated event families.

[[tools]]
name = "codex"
supported_range = ">=0.146.0, <=0.147.0"

[[tools]]
name = "opencode"
supported_range = "=1.18.16"

[[tools]]
name = "acp"
supported_range = "=1.18.0"

