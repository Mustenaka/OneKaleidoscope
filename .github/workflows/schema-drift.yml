name: Schema drift

'on':
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      codex_version:
        description: Exact Codex version to reproduce; blank observes the current release
        required: false
        type: string
      opencode_version:
        description: Exact OpenCode version to reproduce; blank observes the current release
        required: false
        type: string

permissions:
  contents: read

jobs:
  schema-drift:
    name: semantic schema diff
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Resolve observed upstream CLI versions
        id: upstream
        shell: bash
        env:
          CODEX_VERSION_OVERRIDE: ${{ inputs.codex_version }}
          OPENCODE_VERSION_OVERRIDE: ${{ inputs.opencode_version }}
        run: |
          set -euo pipefail

          codex_version="${CODEX_VERSION_OVERRIDE:-}"
          opencode_version="${OPENCODE_VERSION_OVERRIDE:-}"
          if [[ -z "$codex_version" ]]; then
            codex_version="$(npm view @openai/codex dist-tags.latest)"
          fi
          if [[ -z "$opencode_version" ]]; then
            opencode_version="$(npm view opencode-ai dist-tags.latest)"
          fi

          version_pattern='^[0-9]+(\.[0-9]+){2}([+-][0-9A-Za-z.-]+)?$'
          if [[ ! "$codex_version" =~ $version_pattern ]]; then
            echo "invalid Codex package version: $codex_version" >&2
            exit 2
          fi
          if [[ ! "$opencode_version" =~ $version_pattern ]]; then
            echo "invalid OpenCode package version: $opencode_version" >&2
            exit 2
          fi

          echo "codex_version=$codex_version" >> "$GITHUB_OUTPUT"
          echo "opencode_version=$opencode_version" >> "$GITHUB_OUTPUT"
          echo "observed Codex package version: $codex_version"
          echo "observed OpenCode package version: $opencode_version"

      - name: Install exactly the observed upstream CLIs
        shell: bash
        env:
          CODEX_VERSION: ${{ steps.upstream.outputs.codex_version }}
          OPENCODE_VERSION: ${{ steps.upstream.outputs.opencode_version }}
        run: |
          npm install --global \
            "@openai/codex@$CODEX_VERSION" \
            "opencode-ai@$OPENCODE_VERSION"

      - name: Verify installed upstream CLI versions
        shell: bash
        env:
          CODEX_VERSION: ${{ steps.upstream.outputs.codex_version }}
          OPENCODE_VERSION: ${{ steps.upstream.outputs.opencode_version }}
        run: |
          test "$(codex --version)" = "codex-cli $CODEX_VERSION"
          test "$(opencode --version)" = "$OPENCODE_VERSION"

      - name: Check semantic schema drift
        shell: bash
        run: |
          set -o pipefail
          cargo xtask schema diff 2>&1 | tee schema-diff.log

      - name: Retain drift report and observed surface history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-${{ github.run_id }}
          path: |
            schema-diff.log
            schemas/surface-history.jsonl
          if-no-files-found: error
          retention-days: 30
