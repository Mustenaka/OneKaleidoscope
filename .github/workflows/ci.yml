name: CI

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js 22 for Claude SDK sidecar
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/kaleido-adapter-claude/bridge/package-lock.json

      - name: Set up JDK 22 for Kotlin probe
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Set up Gradle 8.14 for Kotlin probe
        if: matrix.os == 'ubuntu-latest'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Run repository checks
        run: cargo xtask ci

      - name: Compile and test the production Ubuntu relay surface
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p kaleido-relay --all-targets --all-features -- -D warnings
          cargo test --locked -p kaleido-relay --all-features
          cargo build --locked --release -p kaleido-relay --all-features
          test -x target/release/kaleido-relay

      - name: Run the self-hosted Ubuntu relay integration gate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p kaleido-relay --all-features \
            tests::self_hosted_relay_admission_forwards_and_revocation_disconnects \
            -- --exact

      - name: Compile Kotlin UniFFI consumer probe
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          java --version
          gradle --version
          cargo build --locked -p kaleido-core --lib
          cargo run --locked -p kaleido-core --bin uniffi-bindgen -- \
            generate --language kotlin \
            --out-dir target/uniffi/kotlin \
            target/debug/libkaleido_core.so
          gradle \
            --project-dir crates/kaleido-core/bindings/kotlin-probe \
            --no-daemon \
            --console=plain \
            compileKotlin

      - name: Compile Swift UniFFI consumer probe
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          swiftc --version
          cargo build --locked -p kaleido-core --lib
          cargo run --locked -p kaleido-core --bin uniffi-bindgen -- \
            generate --language swift \
            --out-dir target/uniffi/swift \
            target/debug/libkaleido_core.dylib

          swift_out="$PWD/target/uniffi/swift"
          swiftc \
            -swift-version 5 \
            -parse-as-library \
            -emit-library \
            -emit-module \
            -module-name KaleidoCoreProbe \
            -emit-module-path "$swift_out/KaleidoCoreProbe.swiftmodule" \
            -I "$swift_out" \
            -L "$PWD/target/debug" \
            -lkaleido_core \
            -Xcc "-fmodule-map-file=$swift_out/kaleido_coreFFI.modulemap" \
            -Xcc "-fmodule-map-file=$swift_out/kaleido_protoFFI.modulemap" \
            "$swift_out/kaleido_proto.swift" \
            "$swift_out/kaleido_core.swift" \
            "$PWD/crates/kaleido-core/bindings/swift-probe/Probe.swift" \
            -o "$swift_out/libKaleidoCoreProbe.dylib"
          test -s "$swift_out/libKaleidoCoreProbe.dylib"
