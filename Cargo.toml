[workspace]
resolver = "2"
members = ["spikes/*", "xtask"]

[workspace.package]
edition = "2021"
rust-version = "1.94.0"
license = "UNLICENSED"
repository = "https://github.com/OneKaleidoscope/OneKaleidoscope"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[patch.crates-io]
directories = { path = "vendor/directories-6.0.0" }
dirs-sys = { path = "vendor/dirs-sys-0.5.0" }
option-ext = { path = "vendor/option-ext-0.2.0" }
