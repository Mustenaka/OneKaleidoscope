[workspace]
resolver = "2"
members = ["crates/*", "spikes/*", "xtask"]

[workspace.package]
edition = "2021"
rust-version = "1.94.0"
license = "UNLICENSED"
repository = "https://github.com/OneKaleidoscope/OneKaleidoscope"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uniffi = "=0.32.0"
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
subtle = "2.6"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
zeroize = "1.8"

[workspace.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[patch.crates-io]
directories = { path = "vendor/directories-6.0.0" }
dirs-sys = { path = "vendor/dirs-sys-0.5.0" }
option-ext = { path = "vendor/option-ext-0.2.0" }
