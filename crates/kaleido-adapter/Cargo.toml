# NOTE: `cargo xtask check-deps` parses `crates/*/Cargo.toml` with its own
# reader, which rejects dotted keys such as `edition.workspace = true`. Use the
# equivalent inline-table form below in every crate under `crates/`.
[package]
name = "kaleido-adapter"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false

[dependencies]
kaleido-proto = { path = "../kaleido-proto" }
sha2 = { version = "=0.11.0", default-features = false }
thiserror = { workspace = true }

[lints]
workspace = true
