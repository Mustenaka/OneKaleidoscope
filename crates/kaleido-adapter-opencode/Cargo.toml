# OpenCode server REST + SSE adapter.  Upstream wire types are generated by
# build.rs from the committed OpenAPI snapshot; none are maintained by hand.
[package]
name = "kaleido-adapter-opencode"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false
build = "build.rs"

[dependencies]
kaleido-adapter = { path = "../kaleido-adapter" }
kaleido-proto = { path = "../kaleido-proto" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json", "query"] }
regress = "=0.11.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
openapiv3 = "=2.2.0"
proc-macro2 = "1"
quote = "1"
rustfmt-wrapper = "=0.2.1"
schemars = "=0.8.22"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
typify = "=0.7.0"

[lints]
workspace = true
