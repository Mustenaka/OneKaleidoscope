# NOTE: `cargo xtask check-deps` parses `crates/*/Cargo.toml` with its own
# reader, which rejects dotted keys such as `edition.workspace = true`. Use the
# equivalent inline-table form below in every crate under `crates/`.
[package]
name = "kaleido-hostd"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false

[dependencies]
kaleido-adapter = { path = "../kaleido-adapter" }
kaleido-adapter-codex = { path = "../kaleido-adapter-codex" }
kaleido-adapter-claude = { path = "../kaleido-adapter-claude" }
kaleido-adapter-opencode = { path = "../kaleido-adapter-opencode" }
kaleido-proto = { path = "../kaleido-proto" }
kaleido-state = { path = "../kaleido-state" }
kaleido-transport = { path = "../kaleido-transport" }
rand_core = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
kaleido-core = { path = "../kaleido-core" }
p256 = { workspace = true }
sha2 = { workspace = true }
tempfile = "=3.27.0"

[lints]
workspace = true
